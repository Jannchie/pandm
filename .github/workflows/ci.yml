name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oldest supported and current — catches syntax/stdlib drift at both ends
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build dashboard
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Tests
        run: uv run pytest tests -q
      - name: Typecheck
        run: uvx pyright

      - name: Lint dashboard
        run: pnpm lint
        working-directory: web
        if: matrix.python-version == '3.13' # once is enough

  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: workers
      - name: Typecheck
        run: pnpm typecheck
        working-directory: workers
      - name: Contract tests
        run: pnpm test
        working-directory: workers
