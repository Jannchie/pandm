services:
  pandm:
    build: .
    ports:
      - '7878:7878'
    environment:
      # register an OAuth App at https://github.com/settings/developers
      # callback URL: https://<your-domain>/api/auth/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # optional: pin the session-signing secret (otherwise generated into /data)
      PANDM_SECRET_KEY: ${PANDM_SECRET_KEY:-}
      # uncomment when serving over HTTPS (recommended)
      # PANDM_SECURE_COOKIES: '1'
    volumes:
      - pandm-data:/data
    restart: unless-stopped

volumes:
  pandm-data:
